<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raumluft-Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef1f4;--surface:#fff;--ink:#1c2733;--muted:#5d6b7a;--line:#d5dce3;
  --good:#1f7a4d;--good-bg:#e1f3e9;--mid:#8a5a00;--mid-bg:#fdf0cf;--bad:#b3261e;--bad-bg:#fbe3e1;
  --track:#e3e8ed;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181f;--surface:#1b242e;--ink:#e8edf2;--muted:#9aa8b6;--line:#2e3a47;
  --good:#6fd39f;--good-bg:#163a29;--mid:#f0c75e;--mid-bg:#3b2f10;--bad:#ff8f86;--bad-bg:#4a1b18;--track:#2a3541;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12181f;--surface:#1b242e;--ink:#e8edf2;--muted:#9aa8b6;--line:#2e3a47;
  --good:#6fd39f;--good-bg:#163a29;--mid:#f0c75e;--mid-bg:#3b2f10;--bad:#ff8f86;--bad-bg:#4a1b18;--track:#2a3541;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Atkinson Hyperlegible",system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-size:1.6rem;margin:0 0 2px}
header p{margin:0;color:var(--muted)}
.status{padding:10px 14px;border-radius:10px;font-weight:700;background:var(--good-bg);color:var(--good)}
.status.mid{background:var(--mid-bg);color:var(--mid)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.banner{margin:0 0 16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.banner.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.banner[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;grid-auto-rows:1fr}
.room{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.room-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.room-head h2{font-size:1.15rem;margin:0}
.room-head small{color:var(--muted)}
.badge{white-space:nowrap;font-weight:700;font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--track);color:var(--muted)}
.good .badge{background:var(--good-bg);color:var(--good)}
.mid .badge{background:var(--mid-bg);color:var(--mid)}
.bad .badge{background:var(--bad-bg);color:var(--bad)}
.co2{padding:18px 18px 8px}
.co2 .label{color:var(--muted);font-size:.95rem}
.co2 .val{font-size:3rem;font-weight:700;line-height:1.05;white-space:nowrap}
.co2 .val span{font-size:1.1rem;font-weight:400;color:var(--muted);margin-left:6px}
.good .val{color:var(--good)}.mid .val{color:var(--mid)}.bad .val{color:var(--bad)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--track);margin-top:12px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:currentColor;transition:width .6s}
.good .bar{color:var(--good)}.mid .bar{color:var(--mid)}.bad .bar{color:var(--bad)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);margin-top:14px;border-top:1px solid var(--line)}
.facts div{background:var(--surface);padding:12px 16px}
.facts div:last-child{grid-column:1/-1}
.facts dt{color:var(--muted);font-size:.85rem}
.facts dd{margin:0;font-size:1.25rem;font-weight:700;white-space:nowrap}
.tip{padding:14px 18px;margin-top:auto;min-height:9.5rem;border-top:1px solid var(--line);font-size:.95rem}
.tip b{display:block}
.alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alerts span{font-size:.85rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bad-bg);color:var(--bad)}
footer{margin-top:20px;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 20px}
@media (max-width:420px){.co2 .val{font-size:2.5rem}.facts dd{font-size:1.1rem}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Raumluftqualität</h1>
      <p>Überblick über die Schulräume, aktualisiert alle 5 Sekunden</p>
    </div>
    <div id="status" class="status" role="status">Lade Daten …</div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section class="grid" id="grid" aria-label="Räume"></section>
  <footer>
    <span id="source"></span>
    <span id="stamp"></span>
    <span>CO₂: unter 1000 ppm gut, bis 2000 ppm mittel, darüber schlecht</span>
  </footer>
</main>
<script>
/* Datenquelle: Backend-API v1 (docs/architektur.md).
   Adresse des Backends: gleicher Server (Standard) oder Adresse in der URL, z. B. ?api=http://localhost:8000
   Ist das Backend beim Start nicht erreichbar, läuft das Dashboard im Demo-Modus mit simulierten Testdaten. */
var API=(new URLSearchParams(location.search).get("api")||"").replace(/\/$/,"")+"/api/v1";
var REFRESH_MS=5000, STALE_MIN=10;
var demo=false, everLive=false;

function getJSON(path){
  return fetch(API+path,{headers:{Accept:"application/json"}}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function loadLive(){
  return getJSON("/rooms").then(function(d){
    return Promise.all(d.rooms.map(function(rm){
      return getJSON("/rooms/"+encodeURIComponent(rm.roomId)+"/latest").then(function(l){
        return {room:rm,m:l.measurement,alerts:l.alerts||[]};
      });
    }));
  });
}

/* ---- Demo-Modus: simulierte Messwerte im Format JSON v1 ---- */
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var sim=[
  {roomId:"5cn",name:"5CN",co2:620,t:21.4,h:46,open:false,openSince:null,coSince:null},
  {roomId:"raum-2",name:"Raum 2",co2:1380,t:23.2,h:55,open:false,openSince:null,coSince:Date.now()-4*60000},
  {roomId:"raum-3",name:"Raum 3",co2:540,t:17.9,h:41,open:true,openSince:Date.now()-20*60000,coSince:null}
];
function loadDemo(){
  var now=Date.now();
  return Promise.resolve(sim.map(function(s){
    if(Math.random()<0.06){s.open=!s.open;s.openSince=s.open?now:null}
    s.co2=clamp(s.co2+(s.open?rnd(-120,-20):rnd(10,90)),420,2400);
    s.t=clamp(s.t+(s.open?rnd(-0.3,0.05):rnd(-0.1,0.2)),16,27);
    s.h=clamp(s.h+rnd(-1.2,1.2),30,70);
    if(s.co2>=1000&&!s.coSince)s.coSince=now;
    if(s.co2<1000)s.coSince=null;
    var iso=new Date(now).toISOString(),al=[];
    if(s.coSince)al.push({type:"co2_high",since:new Date(s.coSince).toISOString()});
    if(s.open&&now-s.openSince>15*60000)al.push({type:"window_open_too_long",since:new Date(s.openSince).toISOString()});
    return {room:{roomId:s.roomId,name:s.name},alerts:al,m:{schemaVersion:1,measurementId:"demo-"+s.roomId,roomId:s.roomId,
      nodeId:"!demo",measuredAt:iso,co2Ppm:Math.round(s.co2),temperatureC:Math.round(s.t*10)/10,
      humidityPct:Math.round(s.h*10)/10,windowOpen:s.open}};
  }));
}

/* ---- Bewertung und Anzeige ---- */
function level(c){return c<1000?"good":c<2000?"mid":"bad"}
var names={good:"Gut",mid:"Mittel",bad:"Schlecht"};
var alertText={co2_high:"CO₂ zu hoch",window_open_too_long:"Fenster zu lange offen"};
function tip(m){
  if(m.windowOpen&&m.temperatureC<19) return ["Fenster schließen","Das Fenster ist offen und der Raum kühlt aus. Das kostet Heizenergie."];
  if(m.windowOpen&&m.co2Ppm>=1000) return ["Weiter lüften","Das Fenster ist offen, die CO₂-Werte sinken."];
  if(!m.windowOpen&&m.co2Ppm>=2000) return ["Sofort lüften","Fenster ganz öffnen und Stoßlüften."];
  if(!m.windowOpen&&m.co2Ppm>=1000) return ["Bald lüften","Die Luft wird schlechter. In den nächsten Minuten Fenster öffnen."];
  if(m.windowOpen) return ["Fenster schließen","Die Luft ist gut. Das Fenster kann wieder zu."];
  return ["Alles in Ordnung","Zurzeit ist kein Lüften nötig."];
}
function statusText(m,b,n){
  var p=[];
  if(b)p.push(b===1?"1 Raum muss sofort gelüftet werden":b+" Räume müssen sofort gelüftet werden");
  if(m)p.push(m===1?"1 Raum sollte bald gelüftet werden":m+" Räume sollten bald gelüftet werden");
  if(n)p.push(n===1?"1 Raum ohne Daten":n+" Räume ohne Daten");
  return p.length?p.join(", "):"Alle Räume in Ordnung";
}
function ago(iso){
  var min=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  return min<1?"gerade eben":"vor "+min+" Min.";
}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function fact(l,v){var d=el("div");d.appendChild(el("dt","",l));d.appendChild(el("dd","",v));return d}
function num(v,d){return v.toFixed(d).replace(".",",")}

function draw(list){
  var g=document.getElementById("grid");g.textContent="";
  var worst="good",nm=0,nb=0,nn=0;
  list.forEach(function(it){
    var m=it.m,stale=m&&(Date.now()-new Date(m.measuredAt).getTime())>STALE_MIN*60000;
    var lv=m?level(m.co2Ppm):"none";
    if(lv==="mid")nm++;if(lv==="bad")nb++;if(!m)nn++;
    var a=el("article","room "+lv);a.setAttribute("aria-label",it.room.name);
    var h=el("div","room-head"),t=el("div");t.appendChild(el("h2","",it.room.name));
    t.appendChild(el("small","",m?"Messung "+ago(m.measuredAt)+(stale?" (veraltet)":""):"Noch keine Messung"));
    h.appendChild(t);h.appendChild(el("span","badge",m?"Luft: "+names[lv]:"Keine Daten"));a.appendChild(h);
    var c=el("div","co2");c.appendChild(el("div","label","CO₂-Gehalt"));
    var v=el("div","val",m?String(m.co2Ppm):"–");v.appendChild(el("span","","ppm"));c.appendChild(v);
    var b=el("div","bar"),f=el("i");f.style.width=m?clamp(m.co2Ppm/2400*100,3,100)+"%":"0%";
    b.appendChild(f);c.appendChild(b);
    var s=el("div","scale");["400","1000","2000 ppm"].forEach(function(x){s.appendChild(el("span","",x))});c.appendChild(s);
    a.appendChild(c);
    var d=el("dl","facts");
    d.appendChild(fact("Temperatur",m?num(m.temperatureC,1)+"\u00a0°C":"–"));
    d.appendChild(fact("Luftfeuchte",m?Math.round(m.humidityPct)+"\u00a0%":"–"));
    d.appendChild(fact("Fenster",m?(m.windowOpen?"offen":"geschlossen"):"–"));
    a.appendChild(d);
    var p=m?tip(m):["Keine Messdaten","Für diesen Raum liegt noch keine Messung vor."],tp=el("div","tip");
    tp.appendChild(el("b","",p[0]));tp.appendChild(document.createTextNode(p[1]));
    if(it.alerts.length){
      var al=el("div","alerts");
      it.alerts.forEach(function(x){
        var tm=new Date(x.since).toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
        al.appendChild(el("span","",(alertText[x.type]||x.type)+" seit "+tm));
      });
      tp.appendChild(al);
    }
    a.appendChild(tp);g.appendChild(a);
  });
  worst=nb?"bad":nm?"mid":"good";
  var st=document.getElementById("status");
  st.className="status "+worst;st.textContent=statusText(nm,nb,nn);
  document.getElementById("stamp").textContent="Stand: "+new Date().toLocaleTimeString("de-AT");
  document.getElementById("source").textContent=demo?"Demo-Modus: simulierte Testdaten":"Live-Daten vom Backend";
}
function banner(text,err){
  var b=document.getElementById("banner");
  b.hidden=!text;b.textContent=text||"";b.className="banner"+(err?" err":"");
}
function refresh(){
  (demo?loadDemo():loadLive()).then(function(list){
    if(!demo){everLive=true;banner("")}
    draw(list);
  }).catch(function(){
    if(!demo&&!everLive){
      demo=true;
      banner("Demo-Modus: Das Backend ist nicht erreichbar. Es werden simulierte Testdaten angezeigt.");
      refresh();
    }else{
      banner("Verbindung zum Backend unterbrochen. Die angezeigten Werte sind möglicherweise nicht aktuell.",true);
    }
  });
}
refresh();
setInterval(refresh,REFRESH_MS);
</script>
</body>
</html>
